server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: madeqrcard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/madeqrcard}
    username: ${DB_USER:madeqrcard}
    password: ${DB_PASSWORD:madeqrcard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # URL publique de l'application (sert aux liens des QR codes et aux redirections Google)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8088}
  jwt-secret: ${JWT_SECRET:}
  jwt-validite-minutes: ${JWT_VALIDITE_MINUTES:480}
  # Cle de chiffrement des secrets 2FA en base
  cle-chiffrement: ${APP_CLE_CHIFFREMENT:}
  admin-email: ${ADMIN_EMAIL:}
  admin-mot-de-passe: ${ADMIN_PASSWORD:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
